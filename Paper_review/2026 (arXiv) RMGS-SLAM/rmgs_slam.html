# Introduction
- SLAM...
- Point cloud를 넘어 scene을 더 디테일하게 표현하기 위해 3D Gaussian을 활용
- 다만, 이런 방식은 real-time SLAM에 부합하지 않음 왜?
  - 실시간 SLAM이라면, 1초에 최소한 10번씩 들어오는 센서 데이터를 처리하고 위치추정, 맵 업데이트를 해야하는데,,
  - 3DGS기반 SLAM은 그게 안됨 - Scene의 퀄리티를 높이려면, iterative optimization에 의존
  - SfM을 input으로 받는 3DGS는 gaussian만 최적화하면 되지만, SLAM은 &lt;span style="color: red;"&gt;**pose**&lt;/span&gt;도 최적화해야함
     - 최적화 할 state가 늘어남

# Method

### Voxel-PCA Geometry fitting
- 먼저, colorized point cloud가 들어오면 hash-indexed voxel 로 나눔
- 각 voxel마다 PCA를 통해 mean `\(\mu\)`, covariance `\(\mathbf{C}\)` 계산 후, EVD로 고유 값, 벡터 추출
`$$\lambda_{min} \leq \lambda_{mid} \leq \lambda_{max}, \quad \mathbf{v}_{min}, \mathbf{v}_{mid}, \mathbf{v}_{max}$$`
- 고유값을 활용해서, voxel의 feature를 planar, line 으로 구분
.f-80.nl-06[
`$$\mathrm{if}\ \lambda_{\min} &lt; \tau_p,\ {\color{red}{\mathrm{planar}}}\ \mathrm{with\ normal}\ \mathbf{v}_{\min};\quad
  \mathrm{if}\ \frac{\lambda_{\max}}{\lambda_{\min}} &gt; \tau_l,\ {\color{blue}{\mathrm{linear}}}\ \mathrm{with\ direction}\ \mathbf{v}_{\max};\quad
  \mathrm{otherwise}\ {\color{gray}{\mathrm{unreliable}}}$$`
  ]

- 위에서 구한 녀석들이 곧 Geometric descriptors `\(\mathbf{g}\)` 로 활용됨 `\(\mathbf{v}_k \in \{\mathbf{v}_{\min}, \mathbf{v}_{\max}\}\)`
.nl-03.nt-01.f80[
`$$\mathbf{g} = [\mathbf{v}_k, \boldsymbol{\mu}]^T \in \mathbb{R}^6, \mathbf{v}_k = \mathbf{v}_{\min} \text{ for planar}, 
\mathbf{v}_k = \mathbf{v}_{\max} \text{ for linear}$$`
]
---
# Method

- FAST-LIVO2로부터 넘어온 pose의 mean과 uncertainty를 이용해서, geometry descriptor의 covraiance를 구함

.f-100.nt-02[
$$\Sigma_{\mathbf{g}} = \mathbf{J}_i\Sigma_i^W\mathbf{J}_i^{\top} $$

$$
\mathbf{J}_i = 
`\begin{bmatrix}
  \mathbf{VF}_i \\
  \frac{1}{N}\mathbf{I}_3
\end{bmatrix}`
, \quad
\mathbf{F}_i =
`\begin{bmatrix}
  \mathbf{f}_i^{(min)}\\
  \mathbf{f}_i^{(mid)}\\
  \mathbf{f}_i^{(max)}\\
\end{bmatrix}`
,
\mathbf{f}_i^{(m)} = 
`\begin{cases}
\frac{(\mathbf{p}_i^W - \boldsymbol{\mu})^\top}{N(\lambda_k - \lambda_m)} (\mathbf{v}_m \mathbf{v}_k^\top + \mathbf{v}_k \mathbf{v}_m^\top), &amp; m \ne k, \\[10pt]
\mathbf{0}, &amp; m = k
\end{cases}`
$$
]

- 즉, Geometry descriptor의 covariance는, 결국 pose의 covariance가 geometry descriptor에 어떻게 영향을 미치는지에 따라 결정
.center.nt-02[
  &lt;img src="fig/geometry_fitting_flow.png" width="75%"&gt;
]

# Method
- 그래서 Geometry fitting은 뭘 하고 싶은거냐...
- FAST-LIVO2로부터 얻은, 3D point를 가지고 만든 **Gaussian에 descriptor**를 붙이고 싶은 것
- 이 때, descriptor를 기준으로 mean, covariance를 다시 구함.
    - 이 과정을 통해 의미있는 voxel들만 남게 됨
    - line, plane을 제외한 unreliable한 voxel은 `\(\mathbf{g}, \mathbf{\Sigma}_{\mathbf{g}} 자체가 없음\)`
    - 최종적으로 살아남은 녀석들은 `\(\mathbf{g}_i = (\mathbf{p}_i^W, \mathbf{R}_{pca}, \mathbf{s}_{pca}, \mathbf{c}_i, m_i)\)`
- 결국 마지막의 `\(\Sigma_{\mathbf{g}}\)`의 trace만 씀
- Backend의 cascaded initialization과 loop closure에 활용

# Method
### Cascaded Gaussian Primitive Initialization
.f-90[
- 모든 frame에 대해서 gaussian을 만들 수 없으니, 일정 간격으로 keyframe을 선정하고, 
subset으로 **loop frame**을 가지고 있는데, **일정한 평행, 회전이동 threshold를 넘기면** loopframe으로도 선정
- 0번째, 1번째 사이의 loop frame들을 local segment로 분류
  - 새로운 loop frame이 들어오면, keyframe에서 관측된 colorized point들을 모두 모으고, 일단 gaussian으로 initialize
  - 위치와 색상은 FAST-LIVO2로부터 얻은 결과를 사용하고, 나머지 Gaussian parameter는 아래와 같이 feed-forward prediction으로 구함
]
$$
\Theta(p) =
`\begin{cases}
\Theta_{\text{model}}(p), &amp; \text{valid model prediction}, \\
\Theta_{\text{pca}}(p), &amp; \text{invalid prediction} \land \text{geo-reliable}, \\
\Theta_{\text{heur}}(p), &amp; \text{otherwise}.
\end{cases}`
$$

# Method

.pull-left.f-80.nt-02[
- i) 에서는, 겹치든 안겹치든 가까운쪽으로 point들을 projection하고, Gaussian을 일단 만듬
- 다만, 한 픽셀에 겹치는 point들도 있기 때문에, ii)에서는 카메라와 가장 가까운 점만 남기고 버림; Ghost 방지
- 픽셀 정중앙이 아닌 경우에, 주변의 4개 픽셀 예측값을 bilinear interpolation해서 gaussian 속성값 계산
  - FFM으로 만들어낸 Gaussian을 정제하는 과정이 ii)
- 마지막 iii)에서는, Transformation을 곱해 camera frame에서 예측한 Gaussian을 world frame로 옮김
- 아래 수식을 통해서 Gaussian의 scale을 결정함

`$$\mathbf{s}_{out} = log((d/f) \cdot \mathbf{a})$$`
`$$\mathbf{s}_{out} = \mathbf{s}_{out} +  log\beta$$`
`$$\mathbf{s}_{out} = log((d/f)$$`
]

# Method
### Optimization
- 매 loop frame이 들어올 때 마다, gaussian은 계속 생성되고, map에 추가될텐데, 중복되는 녀석들은 제거할 필요가있음
  - 가장 가까운 Gaussian과 일정 거리 이하로 가깝거나, alpha값이 일정 threshold보다 낮아서 ghost가 될 가능성이 있어도 제거
- 두 개의 window를 사용하는데, history, current window로 나눔
  - Recent, History window에서 각각 랜덤하게 몇 장의 이미지를 뽑아옴
  - 뽑아온 이미지들 중에서, 아래와 같이 erode mask를 씌운 영역에 대해서만 최적화
`$$\mathcal{M}_{\text{int}} = \mathrm{Erode}(\mathcal{M}_{\text{geo}}, r_{\text{erode}})$$`
`$$\mathcal{L} = \lambda_{\text{rgb}} \mathcal{L}_{\text{rgb}} + \lambda_{\text{ssim}} \mathcal{L}_{\text{ssim}} + \lambda_{\text{depth}} \mathcal{L}_{\text{depth}}$$`

# Method
### Gaussian-based Loop Closure
.f-80[
- Loop closure는 Global 3D Gaussian 맵을 활용해서 수행함
- Loop frame에 대해서, 현재 시간 대비 충분한 시간차이가 있으면서, geometric descriptor가 유사한 keyframe들을 loop candidate로 선정
  - 이 때, 신뢰성 있는 target gaussian set을 정하는 조건은 아래 식과 같음
`$$\mathcal{G}_j^{\text{tar}} = \left\{ G_n \;\middle|\;
\exists\, k \in \mathcal{K}_j,\;
\pi(\mathbf{p}_{c,n}^k) \in \Omega^k,\;
\left\| \boldsymbol{\mu}_n - \mathbf{t}_w^k \right\|_2 &lt; d_{\max},\;
G_n \notin \mathcal{G}_i^{\text{src}}
\right\}$$`

- Point-to-plane residual을 활용하기 위해, 모든 Gaussian의 covariance를 surfel처럼 바꿈
 `$$\tilde{\Lambda} = \operatorname{diag}(1, 1, 10^{-3})$$`

 ]

---
# Method
- 이렇게 만들고 난 뒤에, 신뢰할만한 Gaussian들을 기준으로, 현재 loop frame이 최적이어야 하는 `\(\mathbf{T}\)`를 찾아냄
`$$\mathbf{r}_{mn}(\mathbf{T}) = \boldsymbol{\mu}_n^{\text{tar}} - \mathbf{T}\,\boldsymbol{\mu}_m^{\text{src}}$$`
`$$\boldsymbol{\Sigma}_{mn}(\mathbf{T}) = \tilde{\boldsymbol{\Sigma}}_n^{\text{tar}}$$`

`$$\mathbf{T}_{ij}^{\text{loop}} = \arg\min_{\mathbf{T} \in SE(3)}
\sum_{(m,n)\in \mathcal{C}}
\mathbf{r}_{mn}(\mathbf{T})^\top
\boldsymbol{\Sigma}_{mn}(\mathbf{T})^{-1}
\mathbf{r}_{mn}(\mathbf{T})$$`
- 이후, GTSAM으로 PGO를 수행하면서, error propagation

# Conclusion

- 논문 제목과 달리, Backend optimization에 대한 새로운 기법 제안
  - SLAM 기준에서, Backend engineering 논문!
  - Front-end는 R3LIVE와 유사한 FAST-LIVO2를 사용
- FFM을 사용한 Gaussian param의 예측 뿐만아니라, 정확성을 높이기 위한 Geometric 한 정보도 활용
  - 전체적으로 Gaussian의 정제에 집중한 논문
- LiDAR를 사용하는 논문들은, LiDAR 범위 밖의 영역에 대해서 대부분 floats를 일으키는 문제
