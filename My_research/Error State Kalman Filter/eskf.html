# Review: Kalman Filter

.pull-left[
&lt;img src="fig/graph_KF.png" width="100%"&gt;
&lt;img src="fig/KF_state_update.png" width="72%"&gt;
]

.pull-right.nt-07[
- Linear system

`$$\mathbf{x}_t = \mathbf{A}_t\mathbf{x}_{t-1} + \mathbf{B}_t\mathbf{u}_t + \mathbf{w}_t \text{,}
\qquad \mathbf{w}_t \sim \mathcal{N}(\mathbf{0},\mathbf{R}_t) \text{,}\\
\mathbf{z}_t = \mathbf{C}_t\mathbf{x}_t + \mathbf{v}_t\text{,}
\qquad \mathbf{v}_t \sim \mathcal{N}(\mathbf{0},\mathbf{Q}_t)$$`

- Prediction step

`$$\bar{\boldsymbol{\mu}}_t = \mathbf{A}_t \boldsymbol{\mu}_{t-1} + \mathbf{B}_t\mathbf{u}_t \text{,} \\
\bar{\boldsymbol{\Sigma}}_t = \mathbf{A}_t\boldsymbol{\Sigma}_{t-1}\mathbf{A}_t^{\top}  + \mathbf{R}_t$$`

- Correction step: 

`$$\widehat{\mathbf{z}}_t=\mathbf{C}_t\bar{\boldsymbol{\mu}}_t,\qquad
\mathbf{z}_t-\widehat{\mathbf{z}}_t
=\mathbf{z}_t-\mathbf{C}_t\bar{\boldsymbol{\mu}}_t$$`

`$$\mathbf{K}_t
= \bar{\boldsymbol{\Sigma}}_t\mathbf{C}_t^\top
\left(\mathbf{C}_t\bar{\boldsymbol{\Sigma}}_t\mathbf{C}_t^\top
+\mathbf{Q}_t\right)^{-1},\\
\boldsymbol{\mu}_t
= \bar{\boldsymbol{\mu}}_t
+\mathbf{K}_t\left(\mathbf{z}_t-\mathbf{C}_t\bar{\boldsymbol{\mu}}_t\right),\\
\boldsymbol{\Sigma}_t
= \left(\mathbf{I}-\mathbf{K}_t\mathbf{C}_t\right)
\bar{\boldsymbol{\Sigma}}_t$$`
]

# Review: Extended Kalman Filter

.pull-left[
&lt;img src="fig/1st_order_ekf.png" width="100%"&gt;
]

.pull-right.nt-08[
- Motion and measurement model in nonlinear case

`$$\begin{gathered}
\mathbf{x}_t = f(\mathbf{x}_{t-1},\mathbf{u}_t)+\mathbf{w}_t,\\
\mathbf{z}_t = h(\mathbf{x}_t)+\mathbf{v}_t.
\end{gathered}$$`

- Prediction step 

`$$\begin{gathered}
\bar{\boldsymbol{\mu}}_t
= f(\boldsymbol{\mu}_{t-1},\mathbf{u}_t),\\
\bar{\boldsymbol{\Sigma}}_t
= \mathbf{J}_t\boldsymbol{\Sigma}_{t-1}\mathbf{J}_t^\top
+\mathbf{R}_t.
\end{gathered}$$`

- Correction step

`$$\widehat{\mathbf{z}}_t=h(\bar{\boldsymbol{\mu}}_t),\qquad
\mathbf{z}_t-\widehat{\mathbf{z}}_t
=\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)$$`

`$$\begin{gathered}
\mathbf{K}_t
= \bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
\left(\mathbf{H}_t\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
+\mathbf{Q}_t\right)^{-1},\\
\boldsymbol{\mu}_t
= \bar{\boldsymbol{\mu}}_t
+\mathbf{K}_t\left(\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)\right),\\
\boldsymbol{\Sigma}_t
= (\mathbf{I}-\mathbf{K}_t\mathbf{H}_t)
\bar{\boldsymbol{\Sigma}}_t.
\end{gathered}$$`

]

# Iterative Extended Kalman Filter (IEKF)
.pull-left[
  &lt;img src="fig/taylor_2nd_order.png" width="100%"&gt;
]

.pull-right[
- 다음은 EKF를 반복적으로 수행하는 IEKF(Iterative Extended Kalman Filter)
- EKF의 선형화는, 근사치를 구한 것이라 언급했었음
- IEKF는 이 때 발생하는 근사치의 오차를 줄이기 위해 반복적으로 수행
  - 단, 뒤에서 다룰 ESKF에서 추정하는 error state는 아님
]

---
# IEKF: Commonality
- Prediction step은 동일

.pull-left.f-90[
#### EKF

`$$\begin{gathered}
\mathbf{x}_t
=f(\mathbf{x}_{t-1},\mathbf{u}_t)+\mathbf{w}_t,\\
\mathbf{z}_t
=h(\mathbf{x}_t)+\mathbf{v}_t
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{w}_t\sim\mathcal{N}(\mathbf{0},\mathbf{R}_t),\\
\mathbf{v}_t\sim\mathcal{N}(\mathbf{0},\mathbf{Q}_t)
\end{gathered}$$`

#### Prediction

`$$\bar{\boldsymbol{\mu}}_t
=f(\boldsymbol{\mu}_{t-1},\mathbf{u}_t)$$`

`$$\begin{gathered}
\bar{\boldsymbol{\Sigma}}_t
=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1}\mathbf{J}_t^\top
+\mathbf{R}_t
\end{gathered}$$`
]

.pull-right.f-90[
#### IEKF

`$$\begin{gathered}
\mathbf{x}_t
=f(\mathbf{x}_{t-1},\mathbf{u}_t)+\mathbf{w}_t,\\
\mathbf{z}_t
=h(\mathbf{x}_t)+\mathbf{v}_t
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{w}_t\sim\mathcal{N}(\mathbf{0},\mathbf{R}_t),\\
\mathbf{v}_t\sim\mathcal{N}(\mathbf{0},\mathbf{Q}_t)
\end{gathered}$$`

#### Prediction

`$$\bar{\boldsymbol{\mu}}_t
=f(\boldsymbol{\mu}_{t-1},\mathbf{u}_t)$$`

`$$\begin{gathered}
\bar{\boldsymbol{\Sigma}}_t
=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1}\mathbf{J}_t^\top
+\mathbf{R}_t
\end{gathered}$$`
]

---
# IEKF: Difference
- **실제 측정값 − 예상 측정값**으로 정리하고, IEKF는 선형화점 차이까지 보정

.pull-left.f-90[
#### EKF

`$$\mathbf{H}_t
=\left.
\frac{\partial h}{\partial\mathbf{x}}
\right|_{\mathbf{x}=\bar{\boldsymbol{\mu}}_t}$$`

`$$\begin{gathered}
\mathbf{z}_t\simeq h(\bar{\boldsymbol{\mu}}_t)
+\mathbf{H}_t(\mathbf{x}_t-\bar{\boldsymbol{\mu}}_t)
+\mathbf{v}_t
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)
\simeq\mathbf{H}_t(\mathbf{x}_t-\bar{\boldsymbol{\mu}}_t)
+\mathbf{v}_t
\end{gathered}$$`

]

.pull-right.f-90[
#### IEKF

`$$\begin{gathered}
\boldsymbol{\mu}_{t,0}=\bar{\boldsymbol{\mu}}_t,\\
\mathbf{H}_{t,j}
=\left.
\frac{\partial h}{\partial\mathbf{x}}
\right|_{\mathbf{x}=\boldsymbol{\mu}_{t,j}}
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{z}_t\simeq h(\boldsymbol{\mu}_{t,j})
+\mathbf{H}_{t,j}(\mathbf{x}_t-\boldsymbol{\mu}_{t,j})
+\mathbf{v}_t
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{z}_t-h(\boldsymbol{\mu}_{t,j})
\simeq\mathbf{H}_{t,j}(\mathbf{x}_t-\boldsymbol{\mu}_{t,j})
+\mathbf{v}_t
\end{gathered}$$`



]

---
# IEKF: Kalman Gain · Update
- EKF는 한 번 업데이트하고, IEKF는 gain과 mean을 반복해서 계산

.pull-left.f-90[
#### EKF

`$$\begin{gathered}
\mathbf{K}_t
=\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
\left(
\mathbf{H}_t\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
+\mathbf{Q}_t
\right)^{-1}
\end{gathered}$$`

`$$\begin{gathered}
\boldsymbol{\mu}_t=\bar{\boldsymbol{\mu}}_t
+\mathbf{K}_t\left(
\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)
\right)
\end{gathered}$$`

`$$\boldsymbol{\Sigma}_t
=\left(\mathbf{I}-\mathbf{K}_t\mathbf{H}_t\right)
\bar{\boldsymbol{\Sigma}}_t$$`

- `\(\mathbf{H}_t\)`, `\(\mathbf{K}_t\)`를 한 번 계산하여 mean과 covariance를 갱신
]

.pull-right.f-90[
#### IEKF

`$$\begin{gathered}
\mathbf{K}_{t,j}
=\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_{t,j}^\top
\left(
\mathbf{H}_{t,j}\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_{t,j}^\top
+\mathbf{Q}_t
\right)^{-1}
\end{gathered}$$`

`$$\begin{gathered}
\boldsymbol{\mu}_{t,j+1}=\bar{\boldsymbol{\mu}}_t
+\mathbf{K}_{t,j}\Bigl[
\mathbf{z}_t-h(\boldsymbol{\mu}_{t,j})
-\mathbf{H}_{t,j}
\left(\bar{\boldsymbol{\mu}}_t-\boldsymbol{\mu}_{t,j}\right)
\Bigr]
\end{gathered}$$`

`$$\left\|
\boldsymbol{\mu}_{t,j+1}-\boldsymbol{\mu}_{t,j}
\right\|&lt;\epsilon$$`

`$$\begin{gathered}
\boldsymbol{\mu}_t=\boldsymbol{\mu}_{t,n+1},\\
\boldsymbol{\Sigma}_t
=\left(\mathbf{I}
-\mathbf{K}_{t,n}\mathbf{H}_{t,n}\right)
\bar{\boldsymbol{\Sigma}}_t
\end{gathered}$$`

- 마지막 반복 `\(j=n\)`까지 `\(\bar{\boldsymbol{\Sigma}}_t\)`를 고정하고, covariance는 수렴 후 한 번 갱신
]

---
# IEKF: 그림으로 보면

]

# ESKF (Error-State Kalman Filter)

- 이제 추정하고자 하는 State를 바꿔봅시다
- State 자체를 직접 추정하지 않고, **error**를 추정함
- 즉, 최적화하고 싶은 값이 아닌, error를 state로 둠
  -  Error의 mean, covariance를 추정, ES-EKF라고도 함
`$$\mathbf{x}_t = \hat{\mathbf{x}}_t +  \delta\mathbf{x}_t$$`
  - `\(\mathbf{x}_t\)` : KF, EKF에서 추정 대상으로 두었던 State
  - `\(\hat{\mathbf{x}}_t\)` : `\(t\)` 에서의 nominal state. 여기에 error state를 더해 추정치를 완성
  - `\(\delta\mathbf{x}_t\)` : `\(t\)` 에서의 **Error state**
- 즉, `\(\delta\mathbf{x}_t\)`을 최적화해서, 예측한 nominal state인 `\(\hat{\mathbf{x}}_t\)`에 더하면 우리가 원하는 final state를 얻는다!

---
# ESKF 

- 즉, 구하고자 하는 state는 결국 non-linear이다.
  - 다만, error state는 linear!
  - EKF는 nominal state와 error state의 합을 linearization을 통해 state estimation
      - 연산속도가 error state만 추정했을 때 대비 느리고, 오차도 계속 누적됨
  
- 따라서, EKF 대비 ESKF의 장점은 아래와같음
  - Minimal representation: 자세 오차를 최소 자유도로 표현하여 불필요한 파라미터와 특이점 문제를 줄임
  - Stable linearization: Error state가 원점 근처의 작은 값으로 유지되어 선형화가 쉽고 정확함


---
# ESKF
- 따라서, ESKF의 각 step마다의 model은 아래와 같이 쓸 수 있음
- Error-state Motion Model:
`$$\hat{\mathbf{x}}_t+\delta\mathbf{x}_t=f(\hat{\mathbf{x}}_{t-1},
\delta\mathbf{x}_{t-1},\mathbf{u}_t) + \mathbf{w}_t \text{,} \quad \mathbf{w}_t\sim\mathcal{N}(\mathbf{0},\mathbf{R}_t)$$`
  - Taylor expansion : 
  `$$f(\hat{\mathbf{x}}_{t-1},\delta\mathbf{x}_{t-1},\mathbf{u}_t) 
  \approx f(\hat{\mathbf{x}}_{t-1},\widehat{\delta\mathbf{x}}_{t-1},\mathbf{u}_t) + \mathbf{J}_t(\delta\mathbf{x}_{t-1} - \widehat{\delta\mathbf{x}}_{t-1})$$`


- Error-state Observation Model:
`$$\mathbf{z}_t =h(\hat{\mathbf{x}}_t,\delta\mathbf{x}_t) + \mathbf{v}_t \text{,} \quad \mathbf{v}_t\sim\mathcal{N}(\mathbf{0},\mathbf{Q}_t)$$`
    - Taylor expansion : 
    `$$h(\hat{\mathbf{x}}_t,\delta\mathbf{x}_t) 
    \approx h(\hat{\mathbf{x}}_t,\widehat{\delta\mathbf{x}}_t) + \mathbf{H}_t(\delta\mathbf{x}_t - \widehat{\delta\mathbf{x}}_t)$$`
---
# ESKF
#### Prediction Step

- 수식을 하나씩 뜯어봅시다. 먼저 Motion model
  - Nominal state는 비선형 motion model로 예측하고, error state는 1차 선형화한 모델로 전파
`$$\hat{\mathbf{x}}_t+\delta\mathbf{x}_t
\simeq
f(\hat{\mathbf{x}}_{t-1},
\widehat{\delta\mathbf{x}}_{t-1},
\mathbf{u}_t)+\mathbf{J}_t(\delta\mathbf{x}_{t-1}-\widehat{\delta\mathbf{x}}_{t-1})
+\mathbf{w}_t$$`

- EKF랑도 똑같지요?
`$$\begin{gathered}
\mathbf{x}_t
\simeq
f(\boldsymbol{\mu}_{t-1},\mathbf{u}_t)
+\mathbf{J}_t
(\mathbf{x}_{t-1}-\boldsymbol{\mu}_{t-1})
+\mathbf{w}_t
\end{gathered}$$`

---
# ESKF
- 전개해 봅시다
  - 이전 correction의 보정량은 nominal state에 이미 반영: reset 후 `\(\widehat{\delta\mathbf{x}}_{t-1}=\mathbf{0}\)`
  - 실제로 남은 error `\(\delta\mathbf{x}_{t-1}\)`를 0으로 두는 것은 아님
`$$\hat{\mathbf{x}}_t+\delta\mathbf{x}_t
\simeq\mathbf{J}_t\delta\mathbf{x}_{t-1}
+f(\hat{\mathbf{x}}_{t-1},\widehat{\delta\mathbf{x}}_{t-1},\mathbf{u}_t)
-\mathbf{J}_t\widehat{\delta\mathbf{x}}_{t-1}
+\mathbf{w}_t$$`
`$$\rightarrow \hat{\mathbf{x}}_t+\delta\mathbf{x}_t
\simeq
\mathbf{J}_t\delta\mathbf{x}_{t-1}
+f(\hat{\mathbf{x}}_{t-1}, \mathbf{0}, \mathbf{u}_t)
-\mathbf{J}_t\mathbf{0}
+\mathbf{w}_t$$`

  - `\(\hat{\mathbf{x}}_t=f(\hat{\mathbf{x}}_{t-1},\mathbf{0},\mathbf{u}_t)\)`이므로 nominal prediction을 양쪽에서 빼면
`$$\therefore \delta\mathbf{x}_t \simeq \mathbf{J}_t\delta\mathbf{x}_{t-1} + \mathbf{w}_t,\qquad
\mathbf{J}_t
=\left.\frac{\partial f}{\partial\delta\mathbf{x}_{t-1}}\right|_{\delta\mathbf{x}_{t-1}=\mathbf{0}}$$`



&lt;!-- ---
# ESKF
- 수식을 `\(\delta\mathbf{x}\)`에 대해서 정리해보면
- `\(\bar{\delta\mathbf{x}}_{t-1}\)`과 `\(\delta\mathbf{x}_{t-1}\)`의 차이를 확실히 하고 가야 함
  - 앞에서 0으로 두었던 `\(\bar{\delta\mathbf{x}}_{t-1}\)`은 이전 timestamp 에서 추정한 error의 mean
      - 이전 timestamp에서 이미 error는 적용됬으므로, 이번 timestamp에서는 **0으로 초기화**되어야 함
            - 안그러면 추정된 error가 계속해서 누적됨
  - `\(\delta\mathbf{x}_{t-1}\)`는 이전 timestamp에서 실제로 남은 error

- 따라서, 
`$$\hat{\mathbf{x}}_t+\delta\mathbf{x}_t
\simeq
\mathbf{J}_t\delta\mathbf{x}_{t-1}
+f(\hat{\mathbf{x}}_{t-1}, \mathbf{0}, \mathbf{u}_t)
-\mathbf{J}_t\bar{\delta\mathbf{x}}_{t-1}
+\mathbf{w}_t$$`
`$$\rightarrow \delta\mathbf{x}_t = \mathbf{J}_t\delta\mathbf{x}_{t-1} + \mathbf{w}_t$$` --&gt;


---
# ESKF


- Error state
  - 결국, 우리가 prediction 하고자 하는 **error state**는 이전 timestamp의 error state와 process noise의 조합
`$$\delta\mathbf{x}_t \simeq \mathbf{J}_t\delta\mathbf{x}_{t-1} + \mathbf{w}_t$$`

.pull-left[
- Mean : 
.f-70[이전 error의 평균은 nominal을 기준으로 0이며, process noise의 평균도 0이므로, 예측한 error의 평균 역시 0으로 유지]
`$$\overline{\delta\mathbf{x}}_t
=\mathbf{J}_t\widehat{\delta\mathbf{x}}_{t-1}
+\mathbf{0}
=\mathbf{0}$$`
]

.pull-right[
- Covariance : error state로 편미분한 변화량은 공분산에 반영
`$$\boldsymbol{\Sigma}_{t|t-1}
=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1}\mathbf{J}_t^\top
+\mathbf{R}_t$$`
`$$\delta\mathbf{x}_t\sim\mathcal{N}(\overline{\delta\mathbf{x}}_t,\boldsymbol{\Sigma}_{t|t-1})
=\mathcal{N}(\mathbf{0},\boldsymbol{\Sigma}_{t|t-1})$$`
]

---
# ESKF
#### Correction step

- Correction step의 input은 Prediction에서 구한 nominal state와 error state
`$$(\hat{\mathbf{x}}_t, \ \delta\mathbf{x}_t\sim\mathcal{N}(\overline{\delta\mathbf{x}}_t,\boldsymbol{\Sigma}_{t|t-1}))$$`

- Observation model을 `\(\delta\mathbf{x}_t=\overline{\delta\mathbf{x}}_t\)` 주변에서 1차 근사하고, 괄호를 전개하면
`$$\begin{gathered}
\mathbf{z}_t
\simeq h(\hat{\mathbf{x}}_t,\overline{\delta\mathbf{x}}_t)
+\mathbf{H}_t\left(\delta\mathbf{x}_t-\overline{\delta\mathbf{x}}_t\right)
+\mathbf{v}_t\\
=\mathbf{H}_t\delta\mathbf{x}_t
+h(\hat{\mathbf{x}}_t,\overline{\delta\mathbf{x}}_t)
-\mathbf{H}_t\overline{\delta\mathbf{x}}_t
+\mathbf{v}_t
\rightarrow h(\hat{\mathbf{x}}_t,\mathbf{0})
+\mathbf{H}_t\delta\mathbf{x}_t
+\mathbf{v}_t
\end{gathered}$$`

- Predicted error mean `\(\overline{\delta\mathbf{x}}_t=\mathbf{0}\)`을 대입한 것. 실제 error 항 `\(\mathbf{H}_t\delta\mathbf{x}_t\)`는 남음
`$$\widehat{\mathbf{z}}_t=h(\hat{\mathbf{x}}_t,\mathbf{0}),\qquad
\mathbf{z}_t-\widehat{\mathbf{z}}_t
\simeq\mathbf{H}_t\delta\mathbf{x}_t
+\mathbf{v}_t$$`


---
# ESKF
- Kalman gain의 구조는 EKF와 동일

.pull-left[
#### EKF

`$$\begin{gathered}
\mathbf{K}_t^{\mathrm{EKF}}
=\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
\left(
\mathbf{H}_t\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
+\mathbf{Q}_t
\right)^{-1}
\end{gathered}$$`


#### Mean · Covariance Update

`$$\begin{gathered}
\boldsymbol{\mu}_t
=\bar{\boldsymbol{\mu}}_t
+\mathbf{K}_t^{\mathrm{EKF}}
\left(\mathbf{z}_t-\widehat{\mathbf{z}}_t\right),\\
\boldsymbol{\Sigma}_t
=\left(\mathbf{I}-\mathbf{K}_t^{\mathrm{EKF}}\mathbf{H}_t\right)
\bar{\boldsymbol{\Sigma}}_t
\end{gathered}$$`
]

.pull-right[
#### ESKF


`$$\mathbf{K}_t^{\mathrm{ESKF}}
=\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_t^\top
\left(\mathbf{H}_t\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_t^\top
+\mathbf{Q}_t\right)^{-1}$$`


#### Mean · Covariance Update

`$$\begin{gathered}
\widehat{\delta\mathbf{x}}_t
=\overline{\delta\mathbf{x}}_t
+\mathbf{K}_t^{\mathrm{ESKF}}
\left(
\mathbf{z}_t-\widehat{\mathbf{z}}_t
\right),\quad \overline{\delta\mathbf{x}}_t=\mathbf{0}\\
\boldsymbol{\Sigma}_{t|t}
=\left(\mathbf{I}-\mathbf{K}_t^{\mathrm{ESKF}}\mathbf{H}_t\right)
\boldsymbol{\Sigma}_{t|t-1}
\end{gathered}$$`
]


---
# IESKF (Iterated Error-State Kalman Filter)

- 이제 ESKF의 error-state 표현에 IEKF의 반복 선형화를 적용해 봅시다
- IEKF와 같이 **보정된 추정값에서 재선형화와 보정을 반복**

.pull-left.f-90[
#### ESKF

- 현재 nominal 기준의 error를 추정
- 보정량을 nominal에 한 번 반영

`$$\mathbf{x}_t=\hat{\mathbf{x}}_t+\delta\mathbf{x}_t$$`

`$$\hat{\mathbf{x}}_{t|t}=\hat{\mathbf{x}}_t+\widehat{\delta\mathbf{x}}_t$$`
]

.pull-right.f-90[
#### IESKF

- 현재 nominal 기준의 error를 다시 추정
- 보정된 nominal에서 다시 선형화

`$$\mathbf{x}_t=\hat{\mathbf{x}}_{t,j}+\delta\mathbf{x}_{t,j}$$`

`$$\hat{\mathbf{x}}_{t,j+1}=\hat{\mathbf{x}}_{t,j}+\widehat{\delta\mathbf{x}}_{t,j}$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;

- 실제 error는 `\(\delta\mathbf{x}_{t,j}\)`, 이번 반복에서 추정한 보정량은 `\(\widehat{\delta\mathbf{x}}_{t,j}\)`

.f-80[
이하 앞에서 사용한 덧셈 error 표현과 additive noise 기준. 회전 좌표변환의 상세 내용은 별도 부록.
]

---
# IESKF: Commonality

- Prediction step은 ESKF와 동일

.pull-left.f-90[
#### ESKF

`$$\hat{\mathbf{x}}_t=f(\hat{\mathbf{x}}_{t-1},\mathbf{0},\mathbf{u}_t)$$`

`$$\delta\mathbf{x}_t\simeq\mathbf{J}_t\delta\mathbf{x}_{t-1}+\mathbf{w}_t$$`

`$$\overline{\delta\mathbf{x}}_t=\mathbf{J}_t\widehat{\delta\mathbf{x}}_{t-1}=\mathbf{0}$$`

`$$\boldsymbol{\Sigma}_{t|t-1}=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1|t-1}\mathbf{J}_t^\top+\mathbf{R}_t$$`
]

.pull-right.f-90[
#### IESKF

`$$\hat{\mathbf{x}}_t=f(\hat{\mathbf{x}}_{t-1},\mathbf{0},\mathbf{u}_t)$$`

`$$\delta\mathbf{x}_t\simeq\mathbf{J}_t\delta\mathbf{x}_{t-1}+\mathbf{w}_t$$`

`$$\overline{\delta\mathbf{x}}_t=\mathbf{J}_t\widehat{\delta\mathbf{x}}_{t-1}=\mathbf{0}$$`

`$$\boldsymbol{\Sigma}_{t|t-1}=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1|t-1}\mathbf{J}_t^\top+\mathbf{R}_t$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;

- Prediction에서 얻은 nominal로 첫 반복을 시작

`$$\hat{\mathbf{x}}_{t,0}=\hat{\mathbf{x}}_t$$`

- 반복 중에는 **처음 prior와 같은 측정**을 유지. Prediction을 다시 수행하는 것이 아님

---
# IESKF: Difference

- ESKF는 한 번 선형화, IESKF는 **보정된 nominal에서 다시 선형화**

.pull-left.f-90[
#### ESKF
`$$\mathbf{z}_t\simeq h(\hat{\mathbf{x}}_t,\mathbf{0})+\mathbf{H}_t\delta\mathbf{x}_t+\mathbf{v}_t$$`
`$$\mathbf{z}_t-h(\hat{\mathbf{x}}_t,\mathbf{0})\simeq\mathbf{H}_t\delta\mathbf{x}_t+\mathbf{v}_t$$`
]

.pull-right.f-90[
#### IESKF
`$$\mathbf{z}_t\simeq h(\hat{\mathbf{x}}_{t,j},\mathbf{0})+\mathbf{H}_{t,j}\delta\mathbf{x}_{t,j}+\mathbf{v}_t$$`
`$$\mathbf{z}_t-h(\hat{\mathbf{x}}_{t,j},\mathbf{0})\simeq\mathbf{H}_{t,j}\delta\mathbf{x}_{t,j}+\mathbf{v}_t$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;

- Nominal이 이동하면 **error의 기준도 바뀜**

`$$\delta\mathbf{x}_t=(\hat{\mathbf{x}}_{t,j}-\hat{\mathbf{x}}_t)+\delta\mathbf{x}_{t,j}$$`


---
# IESKF: Kalman Gain · Update

.pull-left.f-85[
#### ESKF

`$$\mathbf{K}_t=\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_t^\top(\mathbf{H}_t\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_t^\top+\mathbf{Q}_t)^{-1}$$`
]

.pull-right.f-85[
#### IESKF

`$$\mathbf{K}_{t,j}=\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_{t,j}^\top(\mathbf{H}_{t,j}\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_{t,j}^\top+\mathbf{Q}_t)^{-1}$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;

- ESKF의 error mean update

`$$\widehat{\delta\mathbf{x}}_t=\overline{\delta\mathbf{x}}_t+\mathbf{K}_t[\mathbf{z}_t-h(\hat{\mathbf{x}}_t,\mathbf{0})],\qquad \overline{\delta\mathbf{x}}_t=\mathbf{0}$$`

- IESKF는 **처음 prior와 현재 nominal의 차이**도 반영

.f-90[
`$$\widehat{\delta\mathbf{x}}_{t,j}=\mathbf{K}_{t,j}[\mathbf{z}_t-h(\hat{\mathbf{x}}_{t,j},\mathbf{0})]-(\mathbf{I}-\mathbf{K}_{t,j}\mathbf{H}_{t,j})(\hat{\mathbf{x}}_{t,j}-\hat{\mathbf{x}}_t)$$`
]

`$$\hat{\mathbf{x}}_{t,j+1}=\hat{\mathbf{x}}_{t,j}+\widehat{\delta\mathbf{x}}_{t,j}$$`

.f-90[
`\(j=0\)`에서는 `\(\hat{\mathbf{x}}_{t,0}=\hat{\mathbf{x}}_t\)`이므로 뒤의 보정항이 0: ESKF와 같은 첫 보정. 이후에는 새 nominal에서 `\(\mathbf{H}_{t,j}\)`와 `\(\mathbf{K}_{t,j}\)`를 다시 계산하며, `\(\boldsymbol{\Sigma}_{t|t-1}\)`는 유지.
]

---
# IESKF: 그림으로 보면

&lt;img src="fig/ieskf_nominal_iteration_ipad.png" width="100%" style="display:block;max-height:400px;object-fit:contain;" alt="같은 시점에서 nominal을 보정하고 새 nominal에서 재선형화하여 error 보정량을 다시 추정하는 IESKF 반복 개념도"&gt;

.f-90[
- 화살표는 실제 error가 아니라, **현재 nominal에서 추정한 보정량** `\(\widehat{\delta\mathbf{x}}_{1,j}\)`
- `\(j=2\)`에서 보정량이 충분히 작아 종료한 예: 최종 nominal은 `\(\hat{\mathbf{x}}_{1,3}\)`
]

???
- `\(t=1\)`은 고정이고, `\(j\)`만 증가한다. 실제 상태 `\(\mathbf{x}_1\)`을 알고 움직이는 그림이 아니다.
- 빨강: `\(\hat{\mathbf{x}}_{1,0}\)`에서 선형화하고 보정량을 추정하여 `\(\hat{\mathbf{x}}_{1,1}\)`로 이동한다.
- 파랑: 새 기준 `\(\hat{\mathbf{x}}_{1,1}\)`에서 Jacobian과 gain을 다시 계산하고 다음 보정량을 추정한다.
- 초록: `\(\hat{\mathbf{x}}_{1,2}\)`에서 구한 보정량을 반영한 뒤 종료 조건을 확인한다. `\(n=2\)`이면 최종 추정값은 `\(\hat{\mathbf{x}}_{1,3}\)`이다.
- 접선은 측정 모델의 국소 선형화이고, 수평 화살표는 prior까지 반영한 상태 보정량이다. 접선만으로 실제값을 찾아가는 Newton root-finding 그림이 아니다.
- 보정량이 줄어드는 예시일 뿐, 매 반복 감소나 실제값으로의 수렴을 보장하지 않는다.

---
# IESKF: 수렴 · Covariance · Reset

.pull-left.f-90[
#### Iteration 종료

- 현재 보정량이 threshold 이하이면 종료
- 최대 반복 횟수도 설정

`$$\|\widehat{\delta\mathbf{x}}_{t,n}\|=\|\hat{\mathbf{x}}_{t,n+1}-\hat{\mathbf{x}}_{t,n}\|&lt;\epsilon$$`

`$$\hat{\mathbf{x}}_{t|t}=\hat{\mathbf{x}}_{t,n}+\widehat{\delta\mathbf{x}}_{t,n}=\hat{\mathbf{x}}_{t,n+1}$$`
]

.pull-right.f-90[
#### Covariance Update

- 반복 중에는 처음 prior covariance를 유지
- 종료 시 마지막 Jacobian과 gain으로 한 번 갱신

`$$\boldsymbol{\Sigma}_{t|t}=(\mathbf{I}-\mathbf{K}_{t,n}\mathbf{H}_{t,n})\boldsymbol{\Sigma}_{t|t-1}$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;

- 최종 nominal에 보정량을 반영한 뒤, **새 nominal을 기준으로 error를 reset**

`$$\delta\mathbf{x}_t^{\mathrm{new}}=\delta\mathbf{x}_{t,n}-\widehat{\delta\mathbf{x}}_{t,n},\qquad \widehat{\delta\mathbf{x}}_t^{\mathrm{new}}=\mathbf{0}$$`

- 0이 되는 것은 error의 **추정 mean**. 불확실성은 남고, 덧셈 좌표에서는 reset으로 covariance가 변하지 않음

.f-80[
MAP·상세 유도·회전 좌표변환: [별도 부록](ieskf_appendix.html)
