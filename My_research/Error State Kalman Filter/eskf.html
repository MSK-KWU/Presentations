# Review: Kalman Filter

.pull-left[
&lt;img src="fig/graph_KF.png" width="100%"&gt;
&lt;img src="fig/KF_state_update.png" width="72%"&gt;
]

.pull-right.nt-07[
- Linear system

`$$\mathbf{x}_t = \mathbf{A}_t\mathbf{x}_{t-1} + \mathbf{B}_t\mathbf{u}_t + \mathbf{w}_t \text{,}
\qquad \mathbf{w}_t \sim \mathcal{N}(\mathbf{0},\mathbf{R}_t) \text{,}\\
\mathbf{z}_t = \mathbf{C}_t\mathbf{x}_t + \mathbf{v}_t\text{,}
\qquad \mathbf{v}_t \sim \mathcal{N}(\mathbf{0},\mathbf{Q}_t)$$`

- Prediction step

`$$\bar{\boldsymbol{\mu}}_t = \mathbf{A}_t \boldsymbol{\mu}_{t-1} + \mathbf{B}_t\mathbf{u}_t \text{,} \\
\bar{\boldsymbol{\Sigma}}_t = \mathbf{A}_t\boldsymbol{\Sigma}_{t-1}\mathbf{A}_t^{\top}  + \mathbf{R}_t$$`

- Correction step: 

`$$\widehat{\mathbf{z}}_t=\mathbf{C}_t\bar{\boldsymbol{\mu}}_t,\qquad
\mathbf{z}_t-\widehat{\mathbf{z}}_t
=\mathbf{z}_t-\mathbf{C}_t\bar{\boldsymbol{\mu}}_t$$`

`$$\mathbf{K}_t
= \bar{\boldsymbol{\Sigma}}_t\mathbf{C}_t^\top
\left(\mathbf{C}_t\bar{\boldsymbol{\Sigma}}_t\mathbf{C}_t^\top
+\mathbf{Q}_t\right)^{-1},\\
\boldsymbol{\mu}_t
= \bar{\boldsymbol{\mu}}_t
+\mathbf{K}_t\left(\mathbf{z}_t-\mathbf{C}_t\bar{\boldsymbol{\mu}}_t\right),\\
\boldsymbol{\Sigma}_t
= \left(\mathbf{I}-\mathbf{K}_t\mathbf{C}_t\right)
\bar{\boldsymbol{\Sigma}}_t$$`
]

# Review: Extended Kalman Filter

.pull-left[
&lt;img src="fig/1st_order_ekf.png" width="100%"&gt;
]

.pull-right.nt-08[
- Motion and measurement model in nonlinear case

`$$\begin{gathered}
\mathbf{x}_t = f(\mathbf{x}_{t-1},\mathbf{u}_t)+\mathbf{w}_t,\\
\mathbf{z}_t = h(\mathbf{x}_t)+\mathbf{v}_t.
\end{gathered}$$`

- Prediction step 

`$$\begin{gathered}
\bar{\boldsymbol{\mu}}_t
= f(\boldsymbol{\mu}_{t-1},\mathbf{u}_t),\\
\bar{\boldsymbol{\Sigma}}_t
= \mathbf{J}_t\boldsymbol{\Sigma}_{t-1}\mathbf{J}_t^\top
+\mathbf{R}_t.
\end{gathered}$$`

- Correction step

`$$\widehat{\mathbf{z}}_t=h(\bar{\boldsymbol{\mu}}_t),\qquad
\mathbf{z}_t-\widehat{\mathbf{z}}_t
=\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)$$`

`$$\begin{gathered}
\mathbf{K}_t
= \bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
\left(\mathbf{H}_t\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
+\mathbf{Q}_t\right)^{-1},\\
\boldsymbol{\mu}_t
= \bar{\boldsymbol{\mu}}_t
+\mathbf{K}_t\left(\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)\right),\\
\boldsymbol{\Sigma}_t
= (\mathbf{I}-\mathbf{K}_t\mathbf{H}_t)
\bar{\boldsymbol{\Sigma}}_t.
\end{gathered}$$`

]

# Iterated Extended Kalman Filter (IEKF)

- 다음은 EKF의 correction을 반복적으로 수행하는 IEKF(Iterated Extended Kalman Filter)
- EKF의 선형화는, 근사치를 구한 것이라 언급했었음
- IEKF는 이 때 발생하는 근사치의 오차를 줄이기 위해 반복적으로 수행
  - 단, 뒤에서 다룰 ESKF에서 추정하는 error state는 아님

---
# IEKF: Commonality
- Prediction step은 동일

.pull-left.f-90[
#### EKF

`$$\begin{gathered}
\mathbf{x}_t
=f(\mathbf{x}_{t-1},\mathbf{u}_t)+\mathbf{w}_t,\\
\mathbf{z}_t
=h(\mathbf{x}_t)+\mathbf{v}_t
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{w}_t\sim\mathcal{N}(\mathbf{0},\mathbf{R}_t),\\
\mathbf{v}_t\sim\mathcal{N}(\mathbf{0},\mathbf{Q}_t)
\end{gathered}$$`

#### Prediction

`$$\bar{\boldsymbol{\mu}}_t
=f(\boldsymbol{\mu}_{t-1},\mathbf{u}_t)$$`

`$$\begin{gathered}
\bar{\boldsymbol{\Sigma}}_t
=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1}\mathbf{J}_t^\top
+\mathbf{R}_t
\end{gathered}$$`
]

.pull-right.f-90[
#### IEKF

`$$\begin{gathered}
\mathbf{x}_t
=f(\mathbf{x}_{t-1},\mathbf{u}_t)+\mathbf{w}_t,\\
\mathbf{z}_t
=h(\mathbf{x}_t)+\mathbf{v}_t
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{w}_t\sim\mathcal{N}(\mathbf{0},\mathbf{R}_t),\\
\mathbf{v}_t\sim\mathcal{N}(\mathbf{0},\mathbf{Q}_t)
\end{gathered}$$`

#### Prediction

`$$\bar{\boldsymbol{\mu}}_t
=f(\boldsymbol{\mu}_{t-1},\mathbf{u}_t)$$`

`$$\begin{gathered}
\bar{\boldsymbol{\Sigma}}_t
=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1}\mathbf{J}_t^\top
+\mathbf{R}_t
\end{gathered}$$`
]

# IEKF: Difference
- **실제 측정값 − 예상 측정값**으로 정리하고, IEKF는 선형화점 차이까지 보정

.pull-left.f-90[
#### EKF

`$$\mathbf{H}_t
=\left.
\frac{\partial h}{\partial\mathbf{x}}
\right|_{\mathbf{x}=\bar{\boldsymbol{\mu}}_t}$$`

`$$\begin{gathered}
\mathbf{z}_t\simeq h(\bar{\boldsymbol{\mu}}_t)
+\mathbf{H}_t(\mathbf{x}_t-\bar{\boldsymbol{\mu}}_t)
+\mathbf{v}_t
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)
\simeq\mathbf{H}_t(\mathbf{x}_t-\bar{\boldsymbol{\mu}}_t)
+\mathbf{v}_t
\end{gathered}$$`

]

.pull-right.f-90[
#### IEKF

`$$\begin{gathered}
\boldsymbol{\mu}_{t,0}=\bar{\boldsymbol{\mu}}_t,\\
\mathbf{H}_{t,j}
=\left.
\frac{\partial h}{\partial\mathbf{x}}
\right|_{\mathbf{x}=\boldsymbol{\mu}_{t,j}}
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{z}_t\simeq h(\boldsymbol{\mu}_{t,j})
+\mathbf{H}_{t,j}(\mathbf{x}_t-\boldsymbol{\mu}_{t,j})
+\mathbf{v}_t
\end{gathered}$$`

`$$\begin{gathered}
\mathbf{z}_t-h(\boldsymbol{\mu}_{t,j})
\simeq\mathbf{H}_{t,j}(\mathbf{x}_t-\boldsymbol{\mu}_{t,j})
+\mathbf{v}_t
\end{gathered}$$`
]


---
# IEKF: Correction step의 반복

- Prediction에서 얻은 추정값으로 시작: `\((\boldsymbol{\mu}_{t,0}=\bar{\boldsymbol{\mu}}_t)\)`
- 같은 시점 `\((t)\)`에서, 측정값 `\((\mathbf{z}_t)\)`과 처음 prior `\((\bar{\boldsymbol{\mu}}_t,\bar{\boldsymbol{\Sigma}}_t)\)`는 고정

.f-90[
#### `\((j=0)\)`: Prediction의 평균에서 첫 선형화

`$$\mathbf{z}_t\simeq h(\bar{\boldsymbol{\mu}}_t)+\mathbf{H}_{t,0}(\mathbf{x}_t-\bar{\boldsymbol{\mu}}_t)+\mathbf{v}_t\quad\xrightarrow{\mathbf{K}_{t,0}}\quad\boldsymbol{\mu}_{t,1}=\bar{\boldsymbol{\mu}}_t+\mathbf{K}_{t,0}\left[\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)\right]$$`

- 선형화한 모델에서 **Kalman gain `\((\mathbf{K}_{t,0})\)`을 계산하고 mean을 업데이트**: EKF와 같은 첫 보정

#### `\((j=1)\)`: 보정한 추정값에서 다시 선형화

`$$\mathbf{z}_t\simeq h(\boldsymbol{\mu}_{t,1})+\mathbf{H}_{t,1}(\mathbf{x}_t-\boldsymbol{\mu}_{t,1})+\mathbf{v}_t\quad\xrightarrow{\mathbf{K}_{t,1}}\quad\boldsymbol{\mu}_{t,2}=\bar{\boldsymbol{\mu}}_t+\mathbf{K}_{t,1}\left[\mathbf{z}_t-\left\{h(\boldsymbol{\mu}_{t,1})+\mathbf{H}_{t,1}(\bar{\boldsymbol{\mu}}_t-\boldsymbol{\mu}_{t,1})\right\}\right]$$`

- `\((\boldsymbol{\mu}_{t,1})\)`에서 `\((\mathbf{H}_{t,1},\mathbf{K}_{t,1})\)`을 다시 계산하고, mean을 `\((\boldsymbol{\mu}_{t,2})\)`로 업데이트
]

---
# IEKF: Correction step의 반복

.f-90[
`$$\mathbf{z}_t\simeq h(\boldsymbol{\mu}_{t,2})+\mathbf{H}_{t,2}(\mathbf{x}_t-\boldsymbol{\mu}_{t,2})+\mathbf{v}_t\quad\xrightarrow{\mathbf{K}_{t,2}}\quad\boldsymbol{\mu}_{t,3}=\bar{\boldsymbol{\mu}}_t+\mathbf{K}_{t,2}\left[\mathbf{z}_t-\left\{h(\boldsymbol{\mu}_{t,2})+\mathbf{H}_{t,2}(\bar{\boldsymbol{\mu}}_t-\boldsymbol{\mu}_{t,2})\right\}\right]$$`
]

&lt;img src="fig/ekf_iekf_relinearization_ipad_v4.png" style="display:block; margin:0 auto; max-width:100%; max-height:390px;" alt="EKF와 IEKF 비교. 접선은 해당 선형화점과 실제 상태 x t 위치까지 이어지고, 확대 원은 같은 x t에서의 곡선과 접선의 차이를 보여줌. 채운 검은 점은 x t, h(x t)이며 빈 검은 점은 마지막 추정값 mu t 3, h(mu t 3)으로 서로 구분됨."&gt;

.center.f-80[
`\(x_t\)`: **추정하려는 실제 상태** (미지수) · `\(\boldsymbol{\mu}_{t,3}\)`: 마지막 추정값 — 둘의 일치를 보장하지 않음.
]

&lt;!-- ???

- 같은 시점 t에서 센서 측정 z_t와 prediction의 prior mean, covariance를 고정한다.
- 빨강에서 파랑, 파랑에서 초록, 초록에서 마지막 점으로 가는 화살표는 각각 K_{t,0}, K_{t,1}, K_{t,2}를 사용한 mean update다.
- j=1부터는 z_t-h(mu_{t,j})뿐 아니라 원래 prior와 현재 선형화점의 차이를 보정하는 항도 포함한다. 현재 평균에 K(z-h)만 계속 더하는 방식이 아니다.
- 채운 검은 점의 좌표는 (x_t, h(x_t))다. x_t는 추정하려는 실제 상태로, 알고리즘은 그 값을 모른다. h(x_t)도 잡음이 포함된 센서 측정값 z_t와 구분한다.
- 확대 원은 바로 그 x_t 위치에서의 곡선과 접선 사이의 차이를 확대한다. 실제 측정값과 예상 측정값의 차이 z_t-h(mu_{t,j})와 구분한다.
- 빈 검은 점은 (mu_{t,3}, h(mu_{t,3}))로 마지막 추정값을 나타낸다. j=2에서 종료하면 이 추정값을 채택하며, 실제 상태 x_t와 일치한다고 가정하지 않는다.
- 이동 방향과 간격은 개념도이며, 오차의 단조 감소나 실제 상태로의 수렴을 보장하지 않는다. --&gt;

# IEKF: Kalman Gain · Update
- EKF는 한 번 업데이트하고, IEKF는 gain과 mean을 반복해서 계산

.pull-left.f-90[
#### EKF

`$$\begin{gathered}
\mathbf{K}_t
=\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
\left(
\mathbf{H}_t\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
+\mathbf{Q}_t
\right)^{-1}
\end{gathered}$$`

`$$\begin{gathered}
\boldsymbol{\mu}_t=\bar{\boldsymbol{\mu}}_t
+\mathbf{K}_t\left(
\mathbf{z}_t-h(\bar{\boldsymbol{\mu}}_t)
\right)
\end{gathered}$$`

`$$\boldsymbol{\Sigma}_t
=\left(\mathbf{I}-\mathbf{K}_t\mathbf{H}_t\right)
\bar{\boldsymbol{\Sigma}}_t$$`

- `\(\mathbf{H}_t\)`, `\(\mathbf{K}_t\)`를 한 번 계산하여 mean과 covariance를 갱신
]

.pull-right.f-90[
#### IEKF

`$$\begin{gathered}
\mathbf{K}_{t,j}
=\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_{t,j}^\top
\left(
\mathbf{H}_{t,j}\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_{t,j}^\top
+\mathbf{Q}_t
\right)^{-1}
\end{gathered}$$`

`$$\boldsymbol{\mu}_{t,j+1}=\bar{\boldsymbol{\mu}}_t+\mathbf{K}_{t,j}\left[\mathbf{z}_t-\left\{h(\boldsymbol{\mu}_{t,j})+\mathbf{H}_{t,j}(\bar{\boldsymbol{\mu}}_t-\boldsymbol{\mu}_{t,j})\right\}\right]$$`

`$$\left\|
\boldsymbol{\mu}_{t,j+1}-\boldsymbol{\mu}_{t,j}
\right\|&lt;\epsilon$$`

`$$\begin{gathered}
\boldsymbol{\mu}_t=\boldsymbol{\mu}_{t,n+1},\\
\boldsymbol{\Sigma}_t
=\left(\mathbf{I}
-\mathbf{K}_{t,n}\mathbf{H}_{t,n}\right)
\bar{\boldsymbol{\Sigma}}_t
\end{gathered}$$`

- 마지막 반복 `\(j=n\)`까지 `\(\bar{\boldsymbol{\Sigma}}_t\)`를 고정하고, covariance는 수렴 후 한 번 갱신
]

# ESKF (Error-State Kalman Filter)

- 이제 추정하고자 하는 State를 바꿔봅시다
- State 자체를 직접 추정하지 않고, **error**를 추정함
- 즉, 최적화하고 싶은 값이 아닌, error를 state로 둠
  -  Error의 mean, covariance를 추정, ES-EKF라고도 함
`$$\mathbf{x}_t = \hat{\mathbf{x}}_t +  \delta\mathbf{x}_t$$`
  - `\(\mathbf{x}_t\)` : KF, EKF에서 추정 대상으로 두었던 State
  - `\(\hat{\mathbf{x}}_t\)` : `\(t\)` 에서의 nominal state. 여기에 error state를 더해 추정치를 완성
  - `\(\delta\mathbf{x}_t\)` : `\(t\)` 에서의 **Error state**
- 즉, `\(\delta\mathbf{x}_t\)`을 최적화해서, 예측한 nominal state인 `\(\hat{\mathbf{x}}_t\)`에 더하면 우리가 원하는 final state를 얻는다!

---
# ESKF 

- State를 전파하는 motion model은 비선형
  - Error dynamics는 작은 error 주변에서 **1차 선형 모델로 근사**
  - EKF는 전체 state에 대해, ESKF는 nominal 기준의 error에 대해 선형화
      - 속도·정확도는 모델과 구현에 따라 달라지며, ESKF에서도 오차가 누적될 수 있음
  
- 따라서, EKF 대비 ESKF의 장점은 아래와같음
  - Minimal representation: 자세 오차를 최소 자유도로 표현하여 불필요한 파라미터와 특이점 문제를 줄임
  - Stable linearization: Error가 원점 근처의 작은 값으로 유지되는 조건에서 1차 근사를 적용하기 유리함


---
# ESKF
- 따라서, ESKF의 각 step마다의 model은 아래와 같이 쓸 수 있음
- Error-state Motion Model:
`$$\hat{\mathbf{x}}_t+\delta\mathbf{x}_t=f(\hat{\mathbf{x}}_{t-1},
\delta\mathbf{x}_{t-1},\mathbf{u}_t) + \mathbf{w}_t \text{,} \quad \mathbf{w}_t\sim\mathcal{N}(\mathbf{0},\mathbf{R}_t)$$`
  - Taylor expansion : 
  `$$f(\hat{\mathbf{x}}_{t-1},\delta\mathbf{x}_{t-1},\mathbf{u}_t) 
  \approx f(\hat{\mathbf{x}}_{t-1},\widehat{\delta\mathbf{x}}_{t-1},\mathbf{u}_t) + \mathbf{J}_t(\delta\mathbf{x}_{t-1} - \widehat{\delta\mathbf{x}}_{t-1})$$`


- Error-state Observation Model:
`$$\mathbf{z}_t =h(\hat{\mathbf{x}}_t,\delta\mathbf{x}_t) + \mathbf{v}_t \text{,} \quad \mathbf{v}_t\sim\mathcal{N}(\mathbf{0},\mathbf{Q}_t)$$`
    - Taylor expansion : 
    `$$h(\hat{\mathbf{x}}_t,\delta\mathbf{x}_t)\approx h(\hat{\mathbf{x}}_t,\overline{\delta\mathbf{x}}_t)+\mathbf{H}_t(\delta\mathbf{x}_t-\overline{\delta\mathbf{x}}_t)$$`
---
# ESKF
#### Prediction Step

- 수식을 하나씩 뜯어봅시다. 먼저 Motion model
  - Nominal state는 비선형 motion model로 예측하고, error state는 1차 선형화한 모델로 전파
`$$\hat{\mathbf{x}}_t+\delta\mathbf{x}_t
\simeq
f(\hat{\mathbf{x}}_{t-1},
\widehat{\delta\mathbf{x}}_{t-1},
\mathbf{u}_t)+\mathbf{J}_t(\delta\mathbf{x}_{t-1}-\widehat{\delta\mathbf{x}}_{t-1})
+\mathbf{w}_t$$`

- EKF랑도 똑같지요?
`$$\begin{gathered}
\mathbf{x}_t
\simeq
f(\boldsymbol{\mu}_{t-1},\mathbf{u}_t)
+\mathbf{J}_t
(\mathbf{x}_{t-1}-\boldsymbol{\mu}_{t-1})
+\mathbf{w}_t
\end{gathered}$$`

---
# ESKF
- 전개해 봅시다
  - 이전 correction의 보정량은 nominal state에 이미 반영: reset 후 `\(\widehat{\delta\mathbf{x}}_{t-1}=\mathbf{0}\)`
  - 실제로 남은 error `\(\delta\mathbf{x}_{t-1}\)`를 0으로 두는 것은 아님
`$$\hat{\mathbf{x}}_t+\delta\mathbf{x}_t
\simeq\mathbf{J}_t\delta\mathbf{x}_{t-1}
+f(\hat{\mathbf{x}}_{t-1},\widehat{\delta\mathbf{x}}_{t-1},\mathbf{u}_t)
-\mathbf{J}_t\widehat{\delta\mathbf{x}}_{t-1}
+\mathbf{w}_t$$`
`$$\rightarrow \hat{\mathbf{x}}_t+\delta\mathbf{x}_t
\simeq
\mathbf{J}_t\delta\mathbf{x}_{t-1}
+f(\hat{\mathbf{x}}_{t-1}, \mathbf{0}, \mathbf{u}_t)
-\mathbf{J}_t\mathbf{0}
+\mathbf{w}_t$$`

  - `\(\hat{\mathbf{x}}_t=f(\hat{\mathbf{x}}_{t-1},\mathbf{0},\mathbf{u}_t)\)`이므로 nominal prediction을 양쪽에서 빼면
`$$\therefore \delta\mathbf{x}_t \simeq \mathbf{J}_t\delta\mathbf{x}_{t-1} + \mathbf{w}_t,\qquad
\mathbf{J}_t
=\left.\frac{\partial f}{\partial\delta\mathbf{x}_{t-1}}\right|_{\delta\mathbf{x}_{t-1}=\mathbf{0}}$$`



&lt;!-- ---
# ESKF
- 수식을 `\(\delta\mathbf{x}\)`에 대해서 정리해보면
- `\(\bar{\delta\mathbf{x}}_{t-1}\)`과 `\(\delta\mathbf{x}_{t-1}\)`의 차이를 확실히 하고 가야 함
  - 앞에서 0으로 두었던 `\(\bar{\delta\mathbf{x}}_{t-1}\)`은 이전 timestamp 에서 추정한 error의 mean
      - 이전 timestamp에서 이미 error는 적용됬으므로, 이번 timestamp에서는 **0으로 초기화**되어야 함
            - 안그러면 추정된 error가 계속해서 누적됨
  - `\(\delta\mathbf{x}_{t-1}\)`는 이전 timestamp에서 실제로 남은 error

- 따라서, 
`$$\hat{\mathbf{x}}_t+\delta\mathbf{x}_t
\simeq
\mathbf{J}_t\delta\mathbf{x}_{t-1}
+f(\hat{\mathbf{x}}_{t-1}, \mathbf{0}, \mathbf{u}_t)
-\mathbf{J}_t\bar{\delta\mathbf{x}}_{t-1}
+\mathbf{w}_t$$`
`$$\rightarrow \delta\mathbf{x}_t = \mathbf{J}_t\delta\mathbf{x}_{t-1} + \mathbf{w}_t$$` --&gt;


---
# ESKF


- Error state
  - 결국, 우리가 prediction 하고자 하는 **error state**는 이전 timestamp의 error state와 process noise의 조합
`$$\delta\mathbf{x}_t \simeq \mathbf{J}_t\delta\mathbf{x}_{t-1} + \mathbf{w}_t$$`

.pull-left[
- Mean : 
.f-70[이전 error의 평균은 nominal을 기준으로 0이며, process noise의 평균도 0이므로, 예측한 error의 평균 역시 0으로 유지]
`$$\overline{\delta\mathbf{x}}_t
=\mathbf{J}_t\widehat{\delta\mathbf{x}}_{t-1}
+\mathbf{0}
=\mathbf{0}$$`
]

.pull-right[
- Covariance : error state로 편미분한 변화량은 공분산에 반영
`$$\boldsymbol{\Sigma}_{t|t-1}
=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1}\mathbf{J}_t^\top
+\mathbf{R}_t$$`
`$$\delta\mathbf{x}_t\sim\mathcal{N}(\overline{\delta\mathbf{x}}_t,\boldsymbol{\Sigma}_{t|t-1})
=\mathcal{N}(\mathbf{0},\boldsymbol{\Sigma}_{t|t-1})$$`
]

---
# ESKF
#### Correction step

- Correction step의 input은 Prediction에서 구한 nominal state와 error state
`$$(\hat{\mathbf{x}}_t, \ \delta\mathbf{x}_t\sim\mathcal{N}(\overline{\delta\mathbf{x}}_t,\boldsymbol{\Sigma}_{t|t-1}))$$`

- Observation model을 `\(\delta\mathbf{x}_t=\overline{\delta\mathbf{x}}_t\)` 주변에서 1차 근사하고, 괄호를 전개하면
`$$\begin{gathered}
\mathbf{z}_t
\simeq h(\hat{\mathbf{x}}_t,\overline{\delta\mathbf{x}}_t)
+\mathbf{H}_t\left(\delta\mathbf{x}_t-\overline{\delta\mathbf{x}}_t\right)
+\mathbf{v}_t\\
=\mathbf{H}_t\delta\mathbf{x}_t
+h(\hat{\mathbf{x}}_t,\overline{\delta\mathbf{x}}_t)
-\mathbf{H}_t\overline{\delta\mathbf{x}}_t
+\mathbf{v}_t
\rightarrow h(\hat{\mathbf{x}}_t,\mathbf{0})
+\mathbf{H}_t\delta\mathbf{x}_t
+\mathbf{v}_t
\end{gathered}$$`

- Predicted error mean `\(\overline{\delta\mathbf{x}}_t=\mathbf{0}\)`을 대입한 것. 실제 error 항 `\(\mathbf{H}_t\delta\mathbf{x}_t\)`는 남음
`$$\widehat{\mathbf{z}}_t=h(\hat{\mathbf{x}}_t,\mathbf{0}),\qquad
\mathbf{z}_t-\widehat{\mathbf{z}}_t
\simeq\mathbf{H}_t\delta\mathbf{x}_t
+\mathbf{v}_t$$`


---
# ESKF
- Kalman gain의 구조는 EKF와 동일

.pull-left[
#### EKF

`$$\begin{gathered}
\mathbf{K}_t^{\mathrm{EKF}}
=\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
\left(
\mathbf{H}_t\bar{\boldsymbol{\Sigma}}_t\mathbf{H}_t^\top
+\mathbf{Q}_t
\right)^{-1}
\end{gathered}$$`


#### Mean · Covariance Update

`$$\begin{gathered}
\boldsymbol{\mu}_t
=\bar{\boldsymbol{\mu}}_t
+\mathbf{K}_t^{\mathrm{EKF}}
\left(\mathbf{z}_t-\widehat{\mathbf{z}}_t\right),\\
\boldsymbol{\Sigma}_t
=\left(\mathbf{I}-\mathbf{K}_t^{\mathrm{EKF}}\mathbf{H}_t\right)
\bar{\boldsymbol{\Sigma}}_t
\end{gathered}$$`
]

.pull-right[
#### ESKF


`$$\mathbf{K}_t^{\mathrm{ESKF}}
=\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_t^\top
\left(\mathbf{H}_t\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_t^\top
+\mathbf{Q}_t\right)^{-1}$$`


#### Mean · Covariance Update

`$$\begin{gathered}
\widehat{\delta\mathbf{x}}_t
=\overline{\delta\mathbf{x}}_t
+\mathbf{K}_t^{\mathrm{ESKF}}
\left(
\mathbf{z}_t-\widehat{\mathbf{z}}_t
\right),\quad \overline{\delta\mathbf{x}}_t=\mathbf{0}\\
\boldsymbol{\Sigma}_{t|t}
=\left(\mathbf{I}-\mathbf{K}_t^{\mathrm{ESKF}}\mathbf{H}_t\right)
\boldsymbol{\Sigma}_{t|t-1}
\end{gathered}$$`
]

# IESKF (Iterated Error-State Kalman Filter)

- 이제 ESKF의 error-state 표현에 IEKF의 반복 선형화를 적용해 봅시다
- IEKF와 같이 **보정된 추정값에서 재선형화와 보정을 반복**

.pull-left.f-90[
#### ESKF

- 현재 nominal 기준의 error를 추정
- 보정량을 nominal에 한 번 반영
`$$\mathbf{x}_t=\hat{\mathbf{x}}_t+\delta\mathbf{x}_t$$`
`$$\hat{\mathbf{x}}_{t|t}=\hat{\mathbf{x}}_t+\widehat{\delta\mathbf{x}}_t$$`
]

.pull-right.f-90[
#### IESKF

- 현재 nominal 기준의 error를 다시 추정
- 보정된 nominal에서 다시 선형화
`$$\mathbf{x}_t=\hat{\mathbf{x}}_{t,j}+\delta\mathbf{x}_{t,j}$$`
`$$\hat{\mathbf{x}}_{t,j+1}=\hat{\mathbf{x}}_{t,j}+\widehat{\delta\mathbf{x}}_{t,j}$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;

.f-80[
이하 수식은 **state와 error를 덧셈으로 합성하는 좌표**와 additive noise를 가정. 회전의 일반적인 합성·좌표변환은 여기서 다루지 않음.
]


---
# IESKF: Commonality

- Prediction step은 ESKF와 동일

.pull-left[
#### ESKF
`$$\hat{\mathbf{x}}_t=f(\hat{\mathbf{x}}_{t-1},\mathbf{0},\mathbf{u}_t)$$`
`$$\delta\mathbf{x}_t\simeq\mathbf{J}_t\delta\mathbf{x}_{t-1}+\mathbf{w}_t$$`
`$$\overline{\delta\mathbf{x}}_t=\mathbf{J}_t\widehat{\delta\mathbf{x}}_{t-1}=\mathbf{0}$$`
`$$\boldsymbol{\Sigma}_{t|t-1}=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1|t-1}\mathbf{J}_t^\top+\mathbf{R}_t$$`
]
.pull-right[
#### IESKF
`$$\hat{\mathbf{x}}_t=f(\hat{\mathbf{x}}_{t-1},\mathbf{0},\mathbf{u}_t)$$`
`$$\delta\mathbf{x}_t\simeq\mathbf{J}_t\delta\mathbf{x}_{t-1}+\mathbf{w}_t$$`
`$$\overline{\delta\mathbf{x}}_t=\mathbf{J}_t\widehat{\delta\mathbf{x}}_{t-1}=\mathbf{0}$$`
`$$\boldsymbol{\Sigma}_{t|t-1}=\mathbf{J}_t\boldsymbol{\Sigma}_{t-1|t-1}\mathbf{J}_t^\top+\mathbf{R}_t$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;


---
# IESKF: Difference

- ESKF는 한 번 선형화, IESKF는 **보정된 nominal에서 다시 선형화**

.pull-left.f-90[
#### ESKF
`$$\mathbf{z}_t\simeq h(\hat{\mathbf{x}}_t,\mathbf{0})+\mathbf{H}_t\delta\mathbf{x}_t+\mathbf{v}_t$$`
`$$\mathbf{z}_t-h(\hat{\mathbf{x}}_t,\mathbf{0})\simeq\mathbf{H}_t\delta\mathbf{x}_t+\mathbf{v}_t$$`
]

.pull-right.f-90[
#### IESKF
`$$\mathbf{z}_t\simeq h(\hat{\mathbf{x}}_{t,j},\mathbf{0})+\mathbf{H}_{t,j}\delta\mathbf{x}_{t,j}+\mathbf{v}_t$$`
`$$\mathbf{z}_t-h(\hat{\mathbf{x}}_{t,j},\mathbf{0})\simeq\mathbf{H}_{t,j}\delta\mathbf{x}_{t,j}+\mathbf{v}_t$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;


---
# IESKF: Correction step의 반복

- Prediction에서 얻은 nominal로 시작: `\(\hat{\mathbf{x}}_{t,0}=\hat{\mathbf{x}}_t\)`
- 같은 시점 `\(t\)`에서, 측정 `\(\mathbf{z}_t\)`와 처음 prior `\(\hat{\mathbf{x}}_t,\boldsymbol{\Sigma}_{t|t-1}\)`는 고정

.f-90[
#### `\(j=0\)`: 처음 nominal에서 선형화 → error mean 추정 → nominal 보정

`$$\mathbf{z}_t\simeq h(\hat{\mathbf{x}}_{t,0},\mathbf{0})+\mathbf{H}_{t,0}\delta\mathbf{x}_{t,0}+\mathbf{v}_t\quad\xrightarrow{\mathbf{K}_{t,0}}\quad\widehat{\delta\mathbf{x}}_{t,0}=\mathbf{K}_{t,0}\left[\mathbf{z}_t-h(\hat{\mathbf{x}}_{t,0},\mathbf{0})\right]$$`

`$$\hat{\mathbf{x}}_{t,1}=\hat{\mathbf{x}}_{t,0}+\widehat{\delta\mathbf{x}}_{t,0}$$`

#### `\(j=1\)`: 보정한 nominal에서 다시 선형화하고, 보정량을 다시 추정

`$$\mathbf{z}_t\simeq h(\hat{\mathbf{x}}_{t,1},\mathbf{0})+\mathbf{H}_{t,1}\delta\mathbf{x}_{t,1}+\mathbf{v}_t\quad\xrightarrow{\mathbf{K}_{t,1}}\quad\widehat{\delta\mathbf{x}}_{t,1}=(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,1})+\mathbf{K}_{t,1}\left[\mathbf{z}_t-\left\{h(\hat{\mathbf{x}}_{t,1},\mathbf{0})+\mathbf{H}_{t,1}(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,1})\right\}\right]$$`

`$$\hat{\mathbf{x}}_{t,2}=\hat{\mathbf{x}}_{t,1}+\widehat{\delta\mathbf{x}}_{t,1}$$`
]

.f-80[
`\(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,1}\)`: **같은 prior를 현재 nominal 기준으로 표현한 error mean**. 첫 반복 `\(j=0\)`에서는 기준점이 같아 0.
]

&lt;!--
Additive state/error coordinates: x_t = xhat_{t,j} + delta x_{t,j}.
The actual error changes reference according to delta x_{t,j+1} = delta x_{t,j} - delta xhat_{t,j}; it is not known to be zero.
Each delta xhat is computed using the original prior and same measurement, not by treating the previous iteration's posterior as a new prior.
--&gt;



---
# IESKF: Kalman Gain · Update

- 매 반복에서 `\(\mathbf{H}_{t,j},\mathbf{K}_{t,j}\)`를 다시 계산. 처음 prior covariance `\(\boldsymbol{\Sigma}_{t|t-1}\)`는 유지

.f-85[
`$$\mathbf{H}_{t,j}=\left.\frac{\partial h(\hat{\mathbf{x}}_{t,j},\delta\mathbf{x}_{t,j})}{\partial\delta\mathbf{x}_{t,j}}\right|_{\delta\mathbf{x}_{t,j}=\mathbf{0}},\qquad\mathbf{K}_{t,j}=\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_{t,j}^\top(\mathbf{H}_{t,j}\boldsymbol{\Sigma}_{t|t-1}\mathbf{H}_{t,j}^\top+\mathbf{Q}_t)^{-1}$$`
]

.f-90[
#### `\(j=2\)`: 새 nominal에서 보정량을 추정하고, 다음 nominal로 반영

`$$\mathbf{z}_t\simeq h(\hat{\mathbf{x}}_{t,2},\mathbf{0})+\mathbf{H}_{t,2}\delta\mathbf{x}_{t,2}+\mathbf{v}_t\quad\xrightarrow{\mathbf{K}_{t,2}}\quad\widehat{\delta\mathbf{x}}_{t,2}=(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,2})+\mathbf{K}_{t,2}\left[\mathbf{z}_t-\left\{h(\hat{\mathbf{x}}_{t,2},\mathbf{0})+\mathbf{H}_{t,2}(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,2})\right\}\right]$$`

`$$\hat{\mathbf{x}}_{t,3}=\hat{\mathbf{x}}_{t,2}+\widehat{\delta\mathbf{x}}_{t,2}$$`
]

- Nominal update까지 정리하면 **앞의 IEKF와 같은 형태**

.f-90[
`$$\hat{\mathbf{x}}_{t,j+1}=\hat{\mathbf{x}}_{t,j}+\widehat{\delta\mathbf{x}}_{t,j}=\hat{\mathbf{x}}_t+\mathbf{K}_{t,j}\left[\mathbf{z}_t-\left\{h(\hat{\mathbf{x}}_{t,j},\mathbf{0})+\mathbf{H}_{t,j}(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,j})\right\}\right]$$`
]



&lt;!--
Eq. (94), J_retraction = I and H_v = I, with the deck's measurement covariance Q_t:
delta xhat_j = K_j[z_t-h(xhat_j,0)] - (I-K_j H_j)(xhat_j-xhat_prior).
Rearrange, without changing the value:
delta xhat_j = (xhat_prior-xhat_j) + K_j[z_t-{h(xhat_j,0)+H_j(xhat_prior-xhat_j)}].
This coordinate-change Jacobian is not the motion Jacobian J_t.
--&gt;

# IESKF: 그림으로 보면

&lt;img src="fig/ieskf_nominal_iteration_ipad_v2.png" width="100%" style="display:block;max-height:440px;object-fit:contain;" alt="IESKF의 j=1 업데이트: 주황색 오른쪽 화살표는 현재 nominal에서 처음 prior nominal까지의 기준 차이, 파란색 왼쪽 화살표는 현재 nominal에서 다음 nominal로 반영할 추정 보정량. 아래에 prior 기준 차이를 포함한 error mean과 nominal update 수식을 표시"&gt;

.f-85[
- 주황색 `\(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,1}\)`: **현재 nominal → 처음 prior**의 기준 차이. 실제 error `\(\mathbf{x}_t-\hat{\mathbf{x}}_{t,1}\)`과 다름.
]

&lt;!-- ???
- 같은 시점 `\(t\)`에서 반복 횟수 `\(j\)`만 증가한다. 측정 `\(\mathbf{z}_t\)`, 처음 prior nominal `\(\hat{\mathbf{x}}_t\)`, prior covariance `\(\boldsymbol{\Sigma}_{t|t-1}\)`는 고정한다.
- 빨강은 처음 prediction한 nominal `\(\hat{\mathbf{x}}_{t,0}=\hat{\mathbf{x}}_t\)`, 파랑은 현재 nominal `\(\hat{\mathbf{x}}_{t,1}\)`, 초록은 보정 후 nominal `\(\hat{\mathbf{x}}_{t,2}\)`이다. 곡선 위 점의 세로 좌표는 각 nominal에서의 `\(h(\hat{\mathbf{x}}_{t,j},\mathbf{0})\)`이며, 실제 상태를 안다는 뜻이 아니다.
- 주황색 화살표는 현재 nominal을 원점으로 보았을 때 같은 prior의 mean이 어디 있는지 보여준다. prior로 되돌아가는 update가 아니다. `\(\hat{\mathbf{x}}_t\)`의 hat을 빼면 모르는 실제 error와 혼동하게 된다.
- 같은 차이가 error mean의 첫 항과 중괄호 안에 모두 들어간다. `\(\mathbf{H}_{t,1}(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,1})\)`은 이 기준 차이를 선형화한 observation 공간으로 옮기는 항이다.

`$$\widehat{\delta\mathbf{x}}_{t,1}=(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,1})+\mathbf{K}_{t,1}\left[\mathbf{z}_t-\left\{h(\hat{\mathbf{x}}_{t,1},\mathbf{0})+\mathbf{H}_{t,1}(\hat{\mathbf{x}}_t-\hat{\mathbf{x}}_{t,1})\right\}\right]$$`

`$$\hat{\mathbf{x}}_{t,2}=\hat{\mathbf{x}}_{t,1}+\widehat{\delta\mathbf{x}}_{t,1}$$`

- 파란색 화살표는 위 수식 전체로 계산한 보정량이다. 이 예에서는 왼쪽으로 이동한다. 주황색 기준 차이 자체나 모르는 실제 error와 같다고 두지 않는다.
- 새 nominal에서 Jacobian과 gain을 다시 계산하고 반복한다. 종료 시 마지막 Jacobian과 gain으로 covariance를 한 번 갱신한다.
- 접선만으로 실제값을 찾아가는 Newton root-finding 그림이 아니다. 매 반복 보정량 감소나 실제값으로의 수렴을 보장하지 않는다. --&gt;

---
# IESKF: 수렴 · Covariance · Reset

.pull-left.f-90[
#### Iteration 종료

- 현재 보정량이 threshold 이하이면 종료
- 최대 반복 횟수도 설정

`$$\|\widehat{\delta\mathbf{x}}_{t,n}\|=\|\hat{\mathbf{x}}_{t,n+1}-\hat{\mathbf{x}}_{t,n}\|&lt;\epsilon$$`

`$$\hat{\mathbf{x}}_{t|t}=\hat{\mathbf{x}}_{t,n}+\widehat{\delta\mathbf{x}}_{t,n}=\hat{\mathbf{x}}_{t,n+1}$$`
]

.pull-right.f-90[
#### Covariance Update

- 반복 중에는 처음 prior covariance를 유지
- 종료 시 마지막 Jacobian과 gain으로 한 번 갱신

`$$\boldsymbol{\Sigma}_{t|t}=(\mathbf{I}-\mathbf{K}_{t,n}\mathbf{H}_{t,n})\boldsymbol{\Sigma}_{t|t-1}$$`
]

&lt;div style="clear:both;"&gt;&lt;/div&gt;

# Conclusion
- KF는 Linear system에서의 optimal state estimation
- EKF는 Non-linear system에서의 approximate state estimation
- IEKF는 Non-linear system에서의 approximate state estimation with repeated linearization
- ESKF는 Non-linear system에서의 approximate state estimation with error-state representation
- IESKF는 Non-linear system에서의 approximate state estimation with error-state representation and repeated linearization
